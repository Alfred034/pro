<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Eyewear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Marcellus&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --ink: #20201e;
        --muted: #77746f;
        --paper: #f7f6f2;
        --line: #e8e6df;
        --primary: #1e1c1a;
        --accent: #d0b98d;
        --panel: rgba(255, 255, 255, 0.94);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Jost", sans-serif;
        background: linear-gradient(135deg, rgba(17,17,17,0.7), rgba(64,63,60,0.4)),
          url("images/banner1.jpg") center/cover no-repeat fixed;
        color: var(--ink);
      }

      a { text-decoration: none; }

      .auth-header {
        max-width: 1200px;
        margin: 0 auto;
        padding: 24px 20px 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand img {
        max-height: 42px;
        width: auto;
      }

      .home-link {
        border: 1px solid rgba(255,255,255,0.7);
        color: #fff;
        border-radius: 999px;
        padding: 10px 18px;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .auth-shell {
        max-width: 520px;
        margin: 70px auto 80px;
        padding: 0 18px;
      }

      .auth-card {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.3);
        border-radius: 22px;
        padding: 38px 30px;
        box-shadow: 0 20px 48px rgba(0,0,0,0.18);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.72rem;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 18px;
        color: var(--primary);
        font-family: "Marcellus", serif;
        font-weight: 400;
      }

      .auth-card p {
        color: var(--muted);
        line-height: 1.7;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 24px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.8rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        background: #fff;
        font: inherit;
        color: var(--ink);
      }

      input:focus {
        outline: 2px solid rgba(208, 185, 141, 0.4);
        border-color: var(--accent);
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .meta-row a {
        color: var(--primary);
        font-weight: 600;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .checkbox input {
        width: auto;
      }

      .primary-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 52px;
        border: none;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <header class="auth-header">
      <a href="index.html" class="brand" aria-label="Eyewear home">
        <img src="images/logo.png" alt="Eyewear logo" />
      </a>
      <a href="index.html" class="home-link">Back to home</a>
    </header>

    <main class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in</h1>
        <p>Access your saved items, track your orders, and continue shopping.</p>

        <form class="auth-form" action="index.html" method="get">
          <div class="form-group">
            <label for="email">Email address</label>
            <input id="email" type="email" name="email" placeholder="you@example.com" required />
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input id="password" type="password" name="password" placeholder="Enter your password" required />
          </div>

          <div class="meta-row">
            <label class="checkbox"><input type="checkbox" /> Remember me</label>
            <a href="signup.html">Forgot password?</a>
          </div>

          <button class="primary-btn" type="submit">Sign in</button>

          <div class="meta-row">
            <span>New customer?</span>
            <a href="signup.html">Create account</a>
          </div>
        </form>
      </section>
    </main>
  </body>
</html>
