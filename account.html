<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account | Eyewear</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Marcellus&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
    <style>
      :root {
        --ink: #20201e;
        --muted: #77746f;
        --paper: #f7f6f2;
        --line: #e8e6df;
        --primary: #1e1c1a;
        --accent: #d0b98d;
        --panel: rgba(255, 255, 255, 0.93);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Jost", sans-serif;
        background: linear-gradient(135deg, rgba(20,20,20,0.7), rgba(76,75,71,0.4)),
          url("images/background-img.jpg") center/cover no-repeat fixed;
        color: var(--ink);
      }

      a { text-decoration: none; }

      .auth-header {
        max-width: 1180px;
        margin: 0 auto;
        padding: 24px 18px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .brand img {
        max-height: 42px;
        width: auto;
      }

      .home-link {
        color: #fff;
        border: 1px solid rgba(255,255,255,0.6);
        padding: 10px 18px;
        border-radius: 999px;
        font-size: 0.95rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .auth-shell {
        max-width: 1180px;
        margin: 48px auto 60px;
        padding: 0 18px;
      }

      .auth-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 28px;
      }

      .auth-card {
        background: var(--panel);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 20px;
        box-shadow: 0 18px 40px rgba(0,0,0,0.18);
        padding: 38px 32px;
        backdrop-filter: blur(8px);
      }

      .eyebrow {
        margin: 0 0 12px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.15em;
        font-size: 0.74rem;
        font-weight: 600;
      }

      h1, h2 {
        margin: 0 0 18px;
        color: var(--primary);
        font-family: "Marcellus", serif;
        font-weight: 400;
      }

      .auth-card p {
        color: var(--muted);
        line-height: 1.7;
      }

      .auth-form {
        display: flex;
        flex-direction: column;
        gap: 16px;
        margin-top: 26px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      label {
        font-size: 0.82rem;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }

      input {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
        background: #fff;
        font: inherit;
        color: var(--ink);
      }

      input:focus {
        outline: 2px solid rgba(208, 185, 141, 0.4);
        border-color: var(--accent);
      }

      .row-group {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .primary-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 52px;
        border: none;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        cursor: pointer;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .primary-btn:hover {
        transform: translateY(-1px);
        opacity: 0.96;
      }

      .secondary-btn {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-height: 52px;
        border: 1px solid var(--primary);
        border-radius: 999px;
        background: transparent;
        color: var(--primary);
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .meta-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .meta-row a {
        color: var(--primary);
        font-weight: 600;
      }

      .checkbox {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 0.92rem;
        color: var(--muted);
      }

      .checkbox input {
        width: auto;
      }

      @media (max-width: 800px) {
        .auth-grid,
        .row-group {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header class="auth-header">
      <a href="index.html" class="brand" aria-label="Eyewear home">
        <img src="images/logo.png" alt="Eyewear logo" />
      </a>
      <a href="index.html" class="home-link">Back to home</a>
    </header>

    <main class="auth-shell">
      <div class="auth-grid">
        <section class="auth-card">
          <p class="eyebrow">Welcome back</p>
          <h1>Sign in</h1>
          <p>Access your saved items, track your orders, and continue shopping with ease.</p>

          <form class="auth-form" action="index.html" method="get">
            <div class="form-group">
              <label for="signin-email">Email address</label>
              <input id="signin-email" type="email" name="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
              <label for="signin-password">Password</label>
              <input id="signin-password" type="password" name="password" placeholder="Enter your password" required />
            </div>

            <div class="meta-row">
              <label class="checkbox"><input type="checkbox" /> Remember me</label>
              <a href="signup.html">Forgot password?</a>
            </div>

            <button class="primary-btn" type="submit">Sign in</button>
          </form>
        </section>

        <section class="auth-card">
          <p class="eyebrow">New here</p>
          <h2>Create account</h2>
          <p>Create a free account to save your favorite frames, receive promotions, and finish checkout faster.</p>

          <form class="auth-form" action="index.html" method="get">
            <div class="row-group">
              <div class="form-group">
                <label for="signup-firstname">First name</label>
                <input id="signup-firstname" type="text" name="firstname" placeholder="John" required />
              </div>
              <div class="form-group">
                <label for="signup-lastname">Last name</label>
                <input id="signup-lastname" type="text" name="lastname" placeholder="Doe" required />
              </div>
            </div>

            <div class="form-group">
              <label for="signup-email">Email address</label>
              <input id="signup-email" type="email" name="email" placeholder="you@example.com" required />
            </div>

            <div class="form-group">
              <label for="signup-password">Password</label>
              <input id="signup-password" type="password" name="password" placeholder="Create a password" required />
            </div>

            <label class="checkbox"><input type="checkbox" required /> I agree to the Terms & Privacy Policy</label>

            <button class="secondary-btn" type="submit">Create account</button>
            <div class="meta-row">
              <span>Already have an account?</span>
              <a href="signin.html">Sign in</a>
            </div>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
